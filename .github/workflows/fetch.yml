name: Günlük veri çekimi

on:
  schedule:
    - cron: "0 4 * * *"      # her gün 04:00 UTC (07:00 TSİ)
  workflow_dispatch:          # elle de çalıştırılabilir

permissions:
  contents: write             # sadece data/ commit'i için

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Veriyi çek
        run: python fetch_data.py
      - name: Değişiklik varsa commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: günlük güncelleme $(date -u +%F)"
          git push
